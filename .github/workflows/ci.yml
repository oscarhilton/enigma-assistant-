name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLCipher (PrivateVault tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlcipher-dev
      - name: Sync workspace
        run: uv sync --all-packages --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run basedpyright
      - name: Test
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  apple-bridge:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        working-directory: apps/apple-bridge
        run: swift test
