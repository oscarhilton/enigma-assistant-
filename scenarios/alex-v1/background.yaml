# Alex v1 background email density (D08c).
#
# Simulation / evaluator metadata only — never sent to Enigma as labels.
#
# Profiles:
#   demo      — small CI / interactive count (this default)
#   canonical — documented ~5k background messages (D08e; requires full corpus)
#   feature   — no background
#   stress    — large developer budgets (not for public Demo)
#
# Default `profile: demo` keeps PR CI fast. Canonical 5k is declared under
# `profiles.canonical` for documentation and future scale runs — do not enable
# it in CI until FinePersonas (or an equivalent) is available offline.
#
# Specs live only under `profiles.*` (no duplicated top-level `email:`).

profile: demo

notes: >
  Story creates meaning. Corpus creates noise. Background traffic is
  finepersonas-mini for CI; production-scale canonical targets ~5000 messages.

profiles:
  feature:
    email: []

  demo:
    email:
      - id: ordinary-correspondence
        corpus: finepersonas-mini
        seed: alex-v1-email-background-v1
        conversation_count: 2
        message_count: 8
        date_range:
          start: 2026-01-05
          end: 2026-01-25
        classification:
          signal_class: background
          expected_attention: false

  # Documented Phase-2 benchmark budget (~5k). Not loaded by default in CI.
  canonical:
    email:
      - id: ordinary-correspondence
        corpus: finepersonas-mini
        seed: alex-v1-email-background-v1
        # Target for full FinePersonas-backed runs (D08e). Mini fixture cannot
        # satisfy 5000 messages; keep conversation_count tiny until then.
        message_count: 5000
        conversation_count: 2
        date_range:
          start: 2026-01-05
          end: 2026-01-25
        classification:
          signal_class: background
          expected_attention: false

  stress:
    email:
      - id: ordinary-correspondence
        corpus: finepersonas-mini
        seed: alex-v1-email-background-stress-v1
        conversation_count: 3
        message_count: 16
        date_range:
          start: 2026-01-05
          end: 2026-01-25
        classification:
          signal_class: background
          expected_attention: false
