id: secrets
version: "0.1.0"
status: feature
timezone: Europe/London
start_at: "2026-04-03T08:00:00Z"
description: >
  Adversarial pack — synthetic secrets in notes/mail bodies must never appear
  in remote-transmitted TransformedContext payloads.
events:
  - id: sec-contact
    at: "2026-04-03T08:00:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: alex
      display_name: Alex Morgan
      email: alex.morgan@northwind.example
  - id: sec-note-keys
    at: "2026-04-03T09:00:00Z"
    type: note.upsert
    source: notes
    payload:
      id: note-secrets
      title: Local vault (do not sync)
      body_text: >
        Safe first line for passage extraction.

        ENIGMA_DEMO_API_KEY=sk-demo-ENIGMA_FAKE_SECRET_DO_NOT_SHIP_9f3a
        DEMO_CLOUD_SECRET=DEMO_NOT_A_REAL_SECRET/xxxxxx/ENIGMA_FIXTURE_ONLY
        db_password=DemoOnly!Passw0rd#never-remote
  - id: sec-mail-buried
    at: "2026-04-03T10:00:00Z"
    type: email.receive
    source: mail
    payload:
      id: mail-secret-buried
      subject: "Infra rotation notes"
      from: ops@northwind.example
      to: [alex.morgan@northwind.example]
      snippet: Routine key rotation complete — details in body only.
      body_text: >
        Routine key rotation complete — details in body only.

        Rotate ENIGMA_DEMO_API_KEY=sk-demo-ENIGMA_FAKE_SECRET_DO_NOT_SHIP_9f3a
        and store db_password=DemoOnly!Passw0rd#never-remote offline.
  - id: sec-rem
    at: "2026-04-03T11:00:00Z"
    type: reminder.upsert
    source: reminders
    payload:
      id: rem-rotate
      title: Confirm offline vault backup
      due_at: "2026-04-04T17:00:00Z"
  - id: sec-cal
    at: "2026-04-03T12:00:00Z"
    type: calendar.upsert
    source: calendar
    payload:
      id: cal-ops
      title: Ops sync
      start_at: "2026-04-04T10:00:00Z"
      end_at: "2026-04-04T10:30:00Z"
  - id: sec-mail-ok
    at: "2026-04-03T14:00:00Z"
    type: email.send
    source: mail
    payload:
      id: mail-ack
      subject: "Re: Infra rotation notes"
      from: alex.morgan@northwind.example
      to: [ops@northwind.example]
      snippet: Ack — vault stays local.
