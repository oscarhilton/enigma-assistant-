id: re-identification
version: "0.1.0"
status: feature
timezone: Europe/London
start_at: "2026-04-05T08:00:00Z"
description: >
  Adversarial pack — distinctive PII in contacts/attendees must resolve to
  PERSON_* tokens only on remote payloads (no raw re-identification).
events:
  - id: rid-contact-target
    at: "2026-04-05T08:00:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: jordan-hale
      display_name: Jordan Hale
      aliases: [J. Hale, Jordy]
      email: jordan.hale@brightside.example
      phone: "+1-555-014-7733"
      organisation: Brightside Analytics
  - id: rid-contact-alex
    at: "2026-04-05T08:01:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: alex
      display_name: Alex Morgan
      email: alex.morgan@northwind.example
      phone: "+44-7700-900111"
  - id: rid-cal-1on1
    at: "2026-04-05T09:00:00Z"
    type: calendar.upsert
    source: calendar
    payload:
      id: cal-1on1
      title: Planning sync
      start_at: "2026-04-06T14:00:00Z"
      end_at: "2026-04-06T14:45:00Z"
      organiser:
        email: alex.morgan@northwind.example
        display_name: Alex Morgan
      attendees:
        - email: jordan.hale@brightside.example
          display_name: Jordan Hale
  - id: rid-mail
    at: "2026-04-05T10:00:00Z"
    type: email.receive
    source: mail
    payload:
      id: mail-from-jordan
      subject: "Numbers for Monday"
      from: jordan.hale@brightside.example
      to: [alex.morgan@northwind.example]
      snippet: Can you confirm the Q2 funnel figures before we meet?
  - id: rid-note
    at: "2026-04-05T18:00:00Z"
    type: note.upsert
    source: notes
    payload:
      id: note-journal
      title: Private journal
      body_text: >
        Met jordan.hale@brightside.example (+1-555-014-7733) today.

        Do not put full dossier remotely.
  - id: rid-rem
    at: "2026-04-05T19:00:00Z"
    type: reminder.upsert
    source: reminders
    payload:
      id: rem-send-figs
      title: Send funnel figures
      due_at: "2026-04-06T12:00:00Z"
