id: background-volume-vs-importance
version: "0.1.0"
status: feature
timezone: Europe/London
start_at: "2026-04-06T08:00:00Z"
description: >
  High-volume irrelevant thread (30 messages) versus a small critical
  canonical obligation. Attention must prefer the obligation, not frequency.
events:
  - id: bv-contact-self
    at: "2026-04-06T08:00:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: alex
      display_name: Alex Morgan
      email: alex.morgan@northwind.example
  - id: bv-contact-jordan
    at: "2026-04-06T08:01:00Z"
