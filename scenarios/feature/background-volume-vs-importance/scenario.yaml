id: background-volume-vs-importance
version: "0.1.0"
status: feature
timezone: Europe/London
start_at: "2026-04-06T08:00:00Z"
description: >
  High-volume irrelevant thread versus a small critical canonical obligation.
  Attention must prefer the obligation, not message frequency (D08e).
events:
  - id: bv-contact-self
    at: "2026-04-06T08:00:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: alex
      display_name: Alex Morgan
      email: alex.morgan@northwind.example
  - id: bv-contact-jordan
    at: "2026-04-06T08:01:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: jordan
      display_name: Jordan Lee
      email: jordan.lee@northwind.example
  - id: bv-mail-critical
    at: "2026-04-06T09:00:00Z"
    type: email.receive
    source: mail
    payload:
      id: mail-critical-visa
      subject: "Visa letter needed by Friday"
      from: jordan.lee@northwind.example
      to: [alex.morgan@northwind.example]
      snippet: HR needs your signed letter before Friday noon.
  - id: bv-rem-visa
    at: "2026-04-06T09:05:00Z"
    type: reminder.upsert
    source: reminders
    payload:
      id: rem-visa-letter
      title: Sign visa letter for Jordan
      due_at: "2026-04-10T12:00:00Z"
      is_completed: false
  # High-volume fluff thread (frequency must not beat the visa obligation).
  - id: bv-vol-01
    at: "2026-04-06T10:01:00Z"
    type: email.receive
    source: mail
    payload: {id: mail-vol-01, subject: "Emoji of the day #1", from: social@northwind.example, snippet: 🙂}
