id: background-basic
version: "0.1.0"
status: feature
timezone: Europe/London
start_at: "2026-03-16T08:00:00Z"
seed: background-basic
description: >
  One canonical obligation-creating email surrounded by ~50 irrelevant
  background messages. Critical recall must hold; evaluator labels never
  reach Enigma ingest.
events:
  - id: bb-contact-alex
    at: "2026-03-16T08:00:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: alex
      display_name: Alex Morgan
      email: alex.morgan@northwind.example
  - id: bb-contact-maya
    at: "2026-03-16T08:05:00Z"
    type: contact.upsert
    source: contacts
    payload:
      id: maya
      display_name: Maya Chen
      email: maya.chen@northwind.example
  - id: bb-cal-standup
    at: "2026-03-16T08:30:00Z"
    type: calendar.upsert
    source: calendar
    payload:
      id: cal-standup
      title: Team standup
      start_at: "2026-03-16T09:00:00Z"
      end_at: "2026-03-16T09:15:00Z"
  - id: bb-mail-canonical
    at: "2026-03-16T12:00:00Z"
    type: email.receive
    source: mail
    payload:
      id: mail-maya-priorities
      subject: Need Q2 design priorities by Thursday
      from: maya.chen@northwind.example
      to: [alex.morgan@northwind.example]
      snippet: Please send ranked Q2 design priorities before Thursday standup.
      body_text: >
        Alex — leadership wants a crisp Q2 design slice. Please send ranked
        priorities before Thursday standup so I can fold them into the roadmap.
  - id: bb-rem-priorities
    at: "2026-03-16T12:05:00Z"
    type: reminder.upsert
    source: reminders
    payload:
      id: rem-q2-priorities
      title: Send Q2 design priorities to Maya
      due_at: "2026-03-19T16:00:00Z"
      is_completed: false
  - id: bb-note-scratch
    at: "2026-03-16T18:00:00Z"
    type: note.upsert
    source: notes
    payload:
      id: note-q2-scratch
      title: Q2 scratch
      body_text: Draft bullets for Maya — still open.
