# F-background-threading — multi-message mini threads (CI, no HF download).
profile: feature

notes: >
  Selects all three finepersonas-mini conversations so multi-message threads
  (mini-conv-001, mini-conv-003) exercise stable thread_id + reply order.

profiles:
  feature:
    email:
      - id: threaded-correspondence
        corpus: finepersonas-mini
        seed: f-background-threading-v1
        conversation_count: 3
        date_range:
          start: 2026-04-06
          end: 2026-04-10
        classification:
          signal_class: background
          expected_attention: false
