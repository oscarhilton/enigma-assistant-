[project]
name = "personal-enigma-domain"
version = "0.1.0"
description = "Canonical private domain models for Enigma"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]
