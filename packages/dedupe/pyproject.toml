[project]
name = "personal-enigma-dedupe"
version = "0.1.0"
description = "Calendar and obligation deduplication helpers"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-domain = { workspace = true }
