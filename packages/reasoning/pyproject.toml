[project]
name = "personal-enigma-reasoning"
version = "0.1.0"
description = "PAYG remote reasoning client — TransformedContext only"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-transformation",
  "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-transformation = { workspace = true }
