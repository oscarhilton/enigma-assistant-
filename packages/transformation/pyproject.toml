[project]
name = "personal-enigma-transformation"
version = "0.1.0"
description = "Enigma transformer interfaces — private to sanitised context"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-domain",
  "personal-enigma-privacy",
  "personal-enigma-identity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-domain = { workspace = true }
personal-enigma-privacy = { workspace = true }
personal-enigma-identity = { workspace = true }
