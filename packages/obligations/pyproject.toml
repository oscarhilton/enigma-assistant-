[project]
name = "personal-enigma-obligations"
version = "0.1.0"
description = "Cross-source obligation merging into typed Obligation records"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-domain",
  "personal-enigma-dedupe",
  "personal-enigma-attention",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-domain = { workspace = true }
personal-enigma-dedupe = { workspace = true }
personal-enigma-attention = { workspace = true }
