[project]
name = "personal-enigma-fixtures"
version = "0.1.0"
description = "Synthetic private-world fixtures for Enigma tests"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-domain",
  "personal-enigma-attention",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-domain = { workspace = true }
personal-enigma-attention = { workspace = true }

[tool.hatch.build.targets.wheel.force-include]
"src/personal_enigma/fixtures/data/demo/semantic/cp-2026-01-19T10:00.json" = "personal_enigma/fixtures/data/demo/semantic/cp-2026-01-19T10:00.json"
"src/personal_enigma/fixtures/data/demo/semantic/cp-2026-01-20T11:00.json" = "personal_enigma/fixtures/data/demo/semantic/cp-2026-01-20T11:00.json"
