[project]
name = "personal-enigma-privacy"
version = "0.1.0"
description = "Privacy levels, leakage invariants, and redaction helpers"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-domain",
  "personal-enigma-transformation",
  "pydantic>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-domain = { workspace = true }
personal-enigma-transformation = { workspace = true }
personal-enigma-fixtures = { workspace = true }

[project.optional-dependencies]
test = ["personal-enigma-fixtures"]
