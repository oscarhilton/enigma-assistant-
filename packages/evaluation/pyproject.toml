[project]
name = "personal-enigma-evaluation"
version = "0.1.0"
description = "Demo Mode evaluation runner, ground truth, and metric placeholders"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-domain",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-domain = { workspace = true }
