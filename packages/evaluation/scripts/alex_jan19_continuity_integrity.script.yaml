scenario: alex_jan19_continuity_integrity
clock: 2026-01-19T10:00:00
checkpoint: cp-2026-01-19T10:00
persona: Alex Morgan
world: alex_v1

frozen_rules:
  - Scripts speak like Alex, never like Enigma internals.
  - Assertions observe public effects + structured boundaries.
  - Model-specific behaviour is replaceable; world truth is not.
  - Not falling back is not the same as understanding.

purpose: >
  After TOKEN is attested complete it must not resurface as next work.
  External-action claims need a receipt. "Did you actually do it?" inspects
  the ledger, never Assist. This / and? / them / the colours keep their
  referents. Turn 38 covers venue, calendar, and email. No invented private
  facts. No timer or send promises Enigma cannot keep.

pass_rule: >
  Judge public effects and must_not flags. Do NOT require exact assistant
  wording. Missing v1 capabilities (action.inspect) defer honestly.

defaults:
  privacy:
    raw_source_allowed_remote: false
    exact_payload_audited: true
    outbound_classification: remote_safe
  authority:
    undeclared_tools_allowed: false
    direct_source_access_by_model: false

turns:
