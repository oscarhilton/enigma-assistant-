    v1: live
    comment: Dump turn 1. Ground today. TOKEN is the strong next action.
    expect:
      tool: agenda.get
      grounded_world_response: true
      tool_required: true
    response:
      must_not:
        - invent_deadline

  # --- dump turn 2 / C18 "this free time" ---
  - user: "what should I do with this free time?"
    v1: live
    comment: >
      Dump turn 2. "this free time" is today's empty calendar + TOKEN, not a
