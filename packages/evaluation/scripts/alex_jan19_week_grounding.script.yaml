# Life Script — Alex, Monday 19 Jan 2026, 10:00.
# Week overview must be grounded in an Enigma capability.
#
# Frozen rules:
#   1. Scripts speak like Alex, never like Enigma internals.
#   2. Assertions observe public effects + structured boundaries.
#   3. Model-specific behaviour is replaceable; world truth is not.
#   4. Not falling back is not the same as understanding.
#
# Live Fireworks finding (PATH=fireworks, no tool):
#   "Whats on this week?" answered from referent_candidates / available_subjects
#   and invented venue/menu/guest list, "you'll host on Saturday", finish
#   mid-week, Atlas "best tackled early in the week to give the proposer time",
#   and framed context items as "scheduled for the week".
#
# Hard C09 invariant:
#   A model may not answer a question about the user's private world from
#   conversational context alone. It must ground the answer through an
#   Enigma capability.
#
# Conversation state resolves language; tools establish truth.
# Context may help the model understand the question. It may not answer it.
# Do NOT map week questions to inventing from referent_candidates.
# Do NOT add regex to intent_router.

scenario: alex_jan19_week_grounding
clock: 2026-01-19T10:00:00
checkpoint: cp-2026-01-19T10:00
persona: Alex Morgan
world: alex_v1

frozen_rules:
  - Scripts speak like Alex, never like Enigma internals.
  - Assertions observe public effects + structured boundaries.
  - Model-specific behaviour is replaceable; world truth is not.
  - Not falling back is not the same as understanding.

purpose: >
  A week-overview question must call agenda.get. Answering from conversation
  state (referent_candidates) with unsourced venues, deadlines, or advice
  is a dangerous failure — even if the prose sounds confident.

pass_rule: >
  Judge capability family, grounding, and must_not invention flags.
  Do NOT require exact assistant wording. No-tool invention must fail.

defaults:
  privacy:
    raw_source_allowed_remote: false
    exact_payload_audited: true
    outbound_classification: remote_safe
  authority:
    undeclared_tools_allowed: false
    direct_source_access_by_model: false

turns:
  - user: "Whats on this week?"
    v1: live
    comment: >
      Private-world week overview. Must call agenda.get (calendar + attention
      + next actions for the period). Must not invent from referent_candidates.
      Catch venue/menu/guest list, finish mid-week, best tackled early,
      proposer needs time, context framed as calendar.
    expect:
      meaning: week_overview
      tool: agenda.get
      arguments:
        period: this_week
      grounded_world_response: true
      tool_required: true
    response:
      must_not:
        - infer_unsourced_task_details
        - invent_deadline
        - invent_recommendation_strength
        - treat_context_as_calendar
        - invent_urgency
