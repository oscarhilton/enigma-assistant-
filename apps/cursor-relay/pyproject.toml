[project]
name = "personal-enigma-cursor-relay"
version = "0.1.0"
description = "Authenticated MCP relay: ChatGPT → Cursor Cloud Agents API"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "pydantic>=2.10.0",
]

[project.scripts]
enigma-cursor-relay = "personal_enigma.cursor_relay.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]
