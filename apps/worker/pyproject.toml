[project]
name = "personal-enigma-worker"
version = "0.1.0"
description = "Enigma ingestion and attention worker"
requires-python = ">=3.12"
dependencies = [
  "personal-enigma-domain",
  "personal-enigma-ingestion",
  "personal-enigma-attention",
  "personal-enigma-fixtures",
  "personal-enigma-api",
  "personal-enigma-reasoning",
]

[project.scripts]
enigma-worker = "personal_enigma.worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_enigma"]

[tool.uv.sources]
personal-enigma-domain = { workspace = true }
personal-enigma-ingestion = { workspace = true }
personal-enigma-attention = { workspace = true }
personal-enigma-fixtures = { workspace = true }
personal-enigma-api = { workspace = true }
personal-enigma-reasoning = { workspace = true }
